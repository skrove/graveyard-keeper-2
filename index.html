<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keeper’s Codex / Кодекс смотрителя — Graveyard Keeper 2</title>
<meta name="description" content="Plan your next day in Graveyard Keeper 2: searchable items, crafting chains, alchemy, quests, traders, maps and skill trees. Unofficial companion in English and Russian.">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&family=Archivo:wght@400;500;600;700&display=swap">
<style>
:root{
  --ground:#E7E5D9; --surface:#F3F1E8; --raised:#FBFAF4; --line:#C9C5B4; --line-soft:#DCD8C9;
  --ink:#1A211F; --dim:#5C655F; --faint:#858D86;
  --brass:#7E6420; --brass-soft:#B49A54;
  --red:#A5372D; --green:#43763A; --blue:#554AA0; --amber:#8F6410;
  --ok:#43763A; --warn:#8F6410; --bad:#A5372D;
  --shadow:0 1px 0 rgba(26,33,31,.06), 0 6px 18px -12px rgba(26,33,31,.35);
  --grid:rgba(26,33,31,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0F1513; --surface:#171E1B; --raised:#1E2724; --line:#2C3733; --line-soft:#232D29;
    --ink:#E7E3D5; --dim:#97A19A; --faint:#6E7872;
    --brass:#CDA55E; --brass-soft:#8C7238;
    --red:#D2584B; --green:#77B160; --blue:#9583DE; --amber:#CC9633;
    --ok:#77B160; --warn:#CC9633; --bad:#D2584B;
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 8px 22px -14px #000;
    --grid:rgba(231,227,213,.045);
  }
}
:root[data-theme="dark"]{
  --ground:#0F1513; --surface:#171E1B; --raised:#1E2724; --line:#2C3733; --line-soft:#232D29;
  --ink:#E7E3D5; --dim:#97A19A; --faint:#6E7872;
  --brass:#CDA55E; --brass-soft:#8C7238;
  --red:#D2584B; --green:#77B160; --blue:#9583DE; --amber:#CC9633;
  --ok:#77B160; --warn:#CC9633; --bad:#D2584B;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 8px 22px -14px #000;
  --grid:rgba(231,227,213,.045);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:Archivo,"Segoe UI",system-ui,sans-serif; font-size:14px; line-height:1.45;
  font-variant-numeric:tabular-nums;
}
h1,h2,h3,h4{margin:0; font-weight:400; text-wrap:balance}
.fell{font-family:"IM Fell English SC","IM Fell English",Georgia,serif; letter-spacing:.01em}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer; background:none; border:none}
a{color:var(--brass); text-decoration:none; border-bottom:1px solid transparent}
a:hover{border-bottom-color:var(--brass)}
:focus-visible{outline:2px solid var(--brass); outline-offset:2px; border-radius:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}

/* ---------- sprite atlas ---------- */
.ic{
  display:inline-block; flex:none; width:var(--s,32px); height:var(--s,32px);
  background-image:url(atlas.png); background-repeat:no-repeat;
  background-size:calc(var(--s,32px) * var(--ac,32)) calc(var(--s,32px) * var(--ar,33));
  background-position:calc(var(--c,0) * var(--s,32px) * -1) calc(var(--r,0) * var(--s,32px) * -1);
}
.ic.none{background-image:none; border:1px dashed var(--line); border-radius:2px}

/* ---------- chrome ---------- */
header.top{
  display:flex; flex-wrap:wrap; align-items:baseline; gap:8px 18px;
  padding:14px 20px 10px; border-bottom:1px solid var(--line);
  background:
    linear-gradient(to bottom, var(--surface), var(--ground));
}
header.top h1{font-size:23px}
header.top h1 .sub{color:var(--dim); font-size:13px; font-family:Archivo,sans-serif; letter-spacing:.06em; text-transform:uppercase}
.counts{display:flex; gap:14px; flex-wrap:wrap; margin-left:auto; color:var(--dim); font-size:12px}
.counts b{color:var(--ink); font-weight:600}
.langsw{display:flex; border:1px solid var(--line); border-radius:2px; overflow:hidden; background:var(--raised)}
.langsw button{padding:3px 10px; font-size:11px; letter-spacing:.09em; color:var(--dim)}
.langsw button+button{border-left:1px solid var(--line)}
.langsw button[aria-pressed="true"]{background:var(--brass); color:var(--surface); font-weight:600}

nav.groups{
  display:flex; gap:4px; padding:8px 14px 0; background:var(--surface); overflow-x:auto; scrollbar-width:none;
}
nav.groups button{
  padding:4px 12px 5px; border:1px solid var(--line); border-bottom:0; border-radius:3px 3px 0 0;
  color:var(--dim); font-size:11.5px; letter-spacing:.1em; text-transform:uppercase; background:var(--ground);
}
nav.groups button[aria-pressed="true"]{color:var(--ink); background:var(--surface); border-color:var(--brass-soft)}
nav.tabs{
  display:flex; gap:2px; padding:0 14px; border-bottom:1px solid var(--line);
  background:var(--surface); overflow-x:auto; scrollbar-width:thin;
}
.donate{
  display:inline-flex; align-items:center; gap:6px; padding:4px 11px; border-radius:2px;
  border:1px solid var(--brass); color:var(--brass); font-size:12px; font-weight:600; white-space:nowrap;
}
.donate:hover{background:var(--brass); color:var(--surface); border-bottom-color:var(--brass)}
.art{display:block; max-width:100%; height:auto; margin:0 auto; image-rendering:auto}
.artbox{background:
  radial-gradient(ellipse at 50% 70%, color-mix(in srgb,var(--brass) 10%,transparent), transparent 65%), var(--raised);
  border:1px solid var(--line-soft); border-radius:2px; padding:8px; display:flex; justify-content:center; align-items:flex-end; min-height:120px}
.mapimg{display:block; width:100%; height:auto; border-radius:2px; border:1px solid var(--line-soft)}
.promo{display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:12px; margin-top:28px}
.promo .card{gap:6px}
.promo h3{font-family:"IM Fell English SC",Georgia,serif; font-size:18px}
.promo .cta{align-self:flex-start; margin-top:4px}
footer.site{max-width:1760px; margin:0 auto; padding:0 20px 36px}
.bar{height:6px; border-radius:3px; background:var(--line-soft); overflow:hidden; min-width:60px}
.bar i{display:block; height:100%; background:var(--brass)}
nav.tabs button{
  padding:9px 14px 8px; color:var(--dim); border-bottom:2px solid transparent; white-space:nowrap;
  font-family:"IM Fell English SC","IM Fell English",Georgia,serif; font-size:16px;
}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--brass)}

main{padding:16px 20px 60px; max-width:1760px; margin:0 auto}
.view[hidden]{display:none!important}

/* ---------- panels ---------- */
.panel{background:var(--surface); border:1px solid var(--line); border-radius:3px}
.panel>.head{
  display:flex; align-items:center; gap:10px; padding:8px 12px;
  border-bottom:1px solid var(--line-soft);
}
.panel>.head h2,.panel>.head h3{font-family:"IM Fell English SC",Georgia,serif; font-size:17px}
.panel>.body{padding:12px}
.eyebrow{font-size:11px; letter-spacing:.11em; text-transform:uppercase; color:var(--faint)}
.rule{height:1px; background:var(--line-soft); border:0; margin:10px 0}

/* ---------- calculator ---------- */
.calc{display:grid; grid-template-columns:320px minmax(0,1fr) 360px; gap:14px; align-items:start}
@media (max-width:1400px){.calc{grid-template-columns:300px minmax(0,1fr)}.calc .col-c{grid-column:1/-1}}
@media (max-width:980px){.calc{grid-template-columns:1fr}}
.col{display:flex; flex-direction:column; gap:14px; min-width:0}

.finder{position:relative}
.finder input{
  width:100%; padding:8px 10px; background:var(--raised); border:1px solid var(--line);
  border-radius:2px;
}
.finder input::placeholder{color:var(--faint)}
.results{
  position:absolute; z-index:40; left:0; right:0; top:calc(100% + 3px); max-height:330px; overflow:auto;
  background:var(--raised); border:1px solid var(--line); box-shadow:var(--shadow); border-radius:2px;
}
.results button{
  display:flex; align-items:center; gap:9px; width:100%; padding:6px 9px; text-align:left;
  border-bottom:1px solid var(--line-soft);
}
.results button:last-child{border-bottom:0}
.results button:hover,.results button.on{background:var(--surface)}
.results .nm{min-width:0}
.results .en{display:block; font-size:11px; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.results .cat{margin-left:auto; font-size:11px; color:var(--faint); white-space:nowrap}

.tgt{display:flex; align-items:center; gap:9px; padding:6px 0; border-bottom:1px solid var(--line-soft)}
.tgt:last-child{border-bottom:0}
.tgt .nm{min-width:0; flex:1}
.tgt .nm small{display:block; color:var(--dim); font-size:11px}
.qty{display:flex; align-items:center; border:1px solid var(--line); border-radius:2px; background:var(--raised)}
.qty button{width:22px; height:24px; color:var(--dim); font-size:15px; line-height:1}
.qty button:hover{color:var(--ink)}
.qty input{width:46px; height:24px; text-align:center; background:none; border:0; border-left:1px solid var(--line-soft); border-right:1px solid var(--line-soft)}
.del{color:var(--faint); padding:2px 4px; font-size:15px}
.del:hover{color:var(--bad)}

.opts{display:flex; flex-direction:column; gap:7px}
.opts label{display:flex; gap:8px; align-items:flex-start; color:var(--dim); cursor:pointer}
.opts input[type=checkbox]{margin:3px 0 0; accent-color:var(--brass)}
.opts label b{color:var(--ink); font-weight:500}
.opts label span{display:block; font-size:11.5px}

/* ---------- craft tree ---------- */
.tree{font-size:13.5px}
.tnode{position:relative; padding-left:19px}
.tnode.root{padding-left:0}
.tnode:not(.root)::before{
  content:""; position:absolute; left:6px; top:0; bottom:0; width:1px; background:var(--line);
}
.trow{display:flex; align-items:center; gap:8px; padding:3px 0; min-height:30px}
.trow .twig{position:absolute; left:6px; width:11px; height:1px; background:var(--line)}
.tw{width:15px; height:15px; flex:none; color:var(--faint); font-size:10px; line-height:15px; text-align:center; border:1px solid var(--line); border-radius:2px; background:var(--raised)}
.tw.hide{visibility:hidden}
.tw:hover{color:var(--ink); border-color:var(--brass-soft)}
.tname{min-width:0}
.tname .en{color:var(--dim); font-size:11px}
.tq{font-weight:600; color:var(--ink); white-space:nowrap}
.tq em{font-style:normal; color:var(--faint); font-weight:400}
.meta{display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-left:auto}

.chip{
  display:inline-flex; align-items:center; gap:4px; padding:1px 7px; border-radius:9px;
  border:1px solid var(--line); color:var(--dim); font-size:11px; white-space:nowrap; background:var(--raised);
}
.chip.stn{border-color:var(--brass-soft); color:var(--brass)}
.chip.m-red{border-color:color-mix(in srgb,var(--red) 55%,transparent); color:var(--red)}
.chip.m-green{border-color:color-mix(in srgb,var(--green) 55%,transparent); color:var(--green)}
.chip.m-blue{border-color:color-mix(in srgb,var(--blue) 55%,transparent); color:var(--blue)}
.chip.m-amber{border-color:color-mix(in srgb,var(--amber) 55%,transparent); color:var(--amber)}
.chip.warn{border-color:color-mix(in srgb,var(--warn) 55%,transparent); color:var(--warn)}
.chip.raw{border-style:dashed}
.chip.act:hover{border-color:var(--brass); color:var(--brass); cursor:pointer}
.pick{background:var(--raised); border:1px solid var(--line); border-radius:2px; color:var(--dim); font-size:11px; padding:1px 4px; max-width:210px}

.note{color:var(--faint); font-size:11.5px; font-style:italic}
.tnode.have>.trow .tname{color:var(--dim)}
.tnode.raw>.trow .tq{color:var(--brass)}

/* ---------- totals ---------- */
.mat{display:flex; align-items:center; gap:8px; padding:4px 0; border-bottom:1px solid var(--line-soft)}
.mat:last-child{border-bottom:0}
.mat .nm{min-width:0; flex:1}
.mat .nm small{display:block; color:var(--dim); font-size:11px}
.mat .n{font-weight:600; white-space:nowrap}
.mat .cv{color:var(--faint); font-size:11px; white-space:nowrap; min-width:64px; text-align:right}

.kv{display:grid; grid-template-columns:auto 1fr; gap:3px 12px}
.kv dt{color:var(--dim)}
.kv dd{margin:0; text-align:right; font-weight:500}

.pts{display:flex; gap:6px; flex-wrap:wrap}
.pt{display:inline-flex; align-items:center; gap:4px; padding:2px 8px; border-radius:2px; font-weight:600; font-size:12px}
.pt.red{color:var(--red); background:color-mix(in srgb,var(--red) 12%,transparent)}
.pt.green{color:var(--green); background:color-mix(in srgb,var(--green) 12%,transparent)}
.pt.blue{color:var(--blue); background:color-mix(in srgb,var(--blue) 12%,transparent)}

/* ---------- tables ---------- */
.scroll{overflow-x:auto}
table{border-collapse:collapse; width:100%; font-size:13px}
th{
  text-align:left; padding:6px 9px; border-bottom:1px solid var(--line); color:var(--faint);
  font-size:11px; letter-spacing:.07em; text-transform:uppercase; font-weight:600;
  position:sticky; top:0; background:var(--surface); z-index:2; white-space:nowrap;
}
th.sortable{cursor:pointer}
th.sortable:hover{color:var(--ink)}
td{padding:5px 9px; border-bottom:1px solid var(--line-soft); vertical-align:middle}
tbody tr:hover{background:var(--raised)}
td.num{text-align:right; white-space:nowrap}
.cell{display:flex; align-items:center; gap:7px; min-width:0}
.cell .en{color:var(--dim); font-size:11px}
.ing{display:flex; flex-wrap:wrap; gap:4px 9px}
.ing span{display:inline-flex; align-items:center; gap:4px; white-space:nowrap}
.ing b{font-weight:600}

/* ---------- filters ---------- */
.filters{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:10px}
.filters input[type=search],.filters select{
  padding:6px 9px; background:var(--raised); border:1px solid var(--line); border-radius:2px;
}
.filters input[type=search]{min-width:230px}
.tagbar{display:flex; flex-wrap:wrap; gap:5px}
.tag{padding:2px 9px; border:1px solid var(--line); border-radius:10px; color:var(--dim); font-size:11.5px; background:var(--raised)}
.tag[aria-pressed="true"]{border-color:var(--brass); color:var(--brass); background:color-mix(in srgb,var(--brass) 10%,transparent)}
.count{color:var(--faint); font-size:12px; margin-left:auto}

/* ---------- cards ---------- */
.grid{display:grid; gap:12px; grid-template-columns:repeat(auto-fill,minmax(310px,1fr))}
.card{background:var(--surface); border:1px solid var(--line); border-radius:3px; padding:11px 12px; display:flex; flex-direction:column; gap:8px}
.card .ttl{display:flex; align-items:center; gap:9px}
.card .ttl h3{font-family:"IM Fell English SC",Georgia,serif; font-size:16px; min-width:0}
.card .ttl .en{font-size:11px; color:var(--dim); display:block}
.card p{margin:0; color:var(--dim); font-size:12.5px}
.list{display:flex; flex-direction:column; gap:3px}
.li{display:flex; align-items:center; gap:7px; font-size:12.5px}
.li .q{font-weight:600; min-width:26px; text-align:right; color:var(--ink)}

/* ---------- detail drawer ---------- */
.drawer{
  position:fixed; inset:0 0 0 auto; width:min(520px,100%); z-index:90;
  background:var(--surface); border-left:1px solid var(--line); box-shadow:-18px 0 40px -28px rgba(0,0,0,.6);
  display:flex; flex-direction:column;
}
.drawer[hidden]{display:none}
.drawer .dhead{display:flex; align-items:center; gap:10px; padding:12px 14px; border-bottom:1px solid var(--line)}
.drawer .dhead h2{font-family:"IM Fell English SC",Georgia,serif; font-size:19px; min-width:0}
.drawer .dhead .en{display:block; font-size:11.5px; color:var(--dim)}
.drawer .dbody{overflow:auto; padding:14px; display:flex; flex-direction:column; gap:14px}
.drawer .x{margin-left:auto; color:var(--dim); font-size:20px; line-height:1}
.drawer .x:hover{color:var(--ink)}
.sect{display:flex; flex-direction:column; gap:6px}
.sect>.eyebrow{border-bottom:1px solid var(--line-soft); padding-bottom:4px}
.backdrop{position:fixed; inset:0; background:rgba(8,12,11,.45); z-index:89}
.backdrop[hidden]{display:none}

.rbox{border:1px solid var(--line-soft); border-radius:2px; padding:8px 9px; display:flex; flex-direction:column; gap:6px; background:var(--raised)}
.rbox .rh{display:flex; align-items:center; gap:7px; flex-wrap:wrap}
.arrow{color:var(--faint)}

.empty{color:var(--faint); font-style:italic; padding:8px 0}
.bignum{font-family:"IM Fell English SC",Georgia,serif; font-size:26px; line-height:1}
.warnbox{border-left:2px solid var(--warn); padding:6px 10px; background:color-mix(in srgb,var(--warn) 8%,transparent); font-size:12.5px; color:var(--dim)}
.prose{max-width:66ch; display:flex; flex-direction:column; gap:10px; color:var(--dim)}
.prose h3{font-family:"IM Fell English SC",Georgia,serif; font-size:18px; color:var(--ink); margin-top:6px}
.prose ul{margin:0; padding-left:20px; display:flex; flex-direction:column; gap:4px}
.prose code{font-size:12px; background:var(--raised); border:1px solid var(--line-soft); padding:1px 4px; border-radius:2px}
.srcline{display:flex; gap:8px; align-items:baseline; font-size:12.5px}
.srcline b{font-weight:600; color:var(--ink); min-width:130px}
</style>

<header class="top">
  <h1 class="fell">Кодекс смотрителя <span class="sub">Graveyard Keeper 2</span></h1>
  <div class="counts" id="counts"></div>
  <a class="donate" id="donate-top" href="https://boosty.to/skrover/donate" target="_blank" rel="noopener">♥ Поддержать</a>
  <div class="langsw" id="langsw" role="group" aria-label="Language"></div>
</header>

<nav class="groups" id="groups"></nav>
<nav class="tabs" role="tablist" id="tabs"></nav>

<main>
  <section class="view" id="v-calc">
    <div class="calc">
      <div class="col col-a">
        <div class="panel">
          <div class="head"><h2 class="fell">Что крафтим</h2></div>
          <div class="body">
            <div class="finder">
              <input id="f-target" type="search" placeholder="Найти предмет (рус. или англ.)" autocomplete="off" aria-label="Поиск предмета для добавления в цель">
              <div class="results" id="r-target" hidden></div>
            </div>
            <div id="targets" style="margin-top:8px"></div>
          </div>
        </div>

        <div class="panel">
          <div class="head"><h2 class="fell">Уже есть в сундуках</h2></div>
          <div class="body">
            <div class="finder">
              <input id="f-inv" type="search" placeholder="Добавить запас" autocomplete="off" aria-label="Поиск предмета для запаса">
              <div class="results" id="r-inv" hidden></div>
            </div>
            <div id="inv" style="margin-top:8px"></div>
          </div>
        </div>

        <div class="panel">
          <div class="head"><h2 class="fell">Допущения</h2></div>
          <div class="body opts">
            <label><input type="checkbox" id="o-perks"><span><b>Считать перки</b><span>брать повышенный выход, где он указан («3 (4 с Fireman)»)</span></span></label>
            <label><input type="checkbox" id="o-station"><span><b>Учитывать постройку станков</b><span>показать стоимость станков, которые нужны по плану</span></span></label>
            <label><input type="checkbox" id="o-alch"><span><b>Раскрывать алхимию</b><span>подставлять один из примеров смеси вместо «купить/сварить»</span></span></label>
            <label><input type="checkbox" id="o-fuel"><span><b>Разложить топливо</b><span>Fuel → дрова → брёвна вместо готового топлива</span></span></label>
            <hr class="rule">
            <button class="chip act" id="btn-copy" style="align-self:flex-start">Скопировать план текстом</button>
            <button class="chip act" id="btn-reset" style="align-self:flex-start">Сбросить всё</button>
          </div>
        </div>
      </div>

      <div class="col col-b">
        <div class="panel">
          <div class="head">
            <h2 class="fell">План крафта</h2>
            <span class="count" id="plan-count"></span>
          </div>
          <div class="body"><div class="tree" id="tree"></div></div>
        </div>
        <div class="panel">
          <div class="head"><h2 class="fell">Порядок работ по станкам</h2></div>
          <div class="body"><div id="bystation"></div></div>
        </div>
      </div>

      <div class="col col-c">
        <div class="panel">
          <div class="head"><h2 class="fell">Добыть и закупить</h2><span class="count" id="raw-count"></span></div>
          <div class="body"><div id="raw"></div></div>
        </div>
        <div class="panel">
          <div class="head"><h2 class="fell">Итоги</h2></div>
          <div class="body" id="totals"></div>
        </div>
        <div class="panel">
          <div class="head"><h2 class="fell">Требования</h2></div>
          <div class="body" id="reqs"></div>
        </div>
      </div>
    </div>
  </section>

/* db.js не загрузился — без него нет ни базы, ни атласа иконок.

if (!DB || !ATLAS) {

      and serve the folder over http instead of opening the file directly.</p>

/* Сборщик базы (PowerShell) схлопывает массив из одного элемента в объект —
   возвращаем спискам форму массива, иначе половина карточек не итерируется. */
const A = v => Array.isArray(v) ? v : (v == null || v === '' ? [] : [v]);
document.documentElement.style.setProperty('--ac', ATLAS.cols);
document.documentElement.style.setProperty('--ar', ATLAS.rows);
(function normalize() {
  const CARD = ['ch', 'meta', 'i', 'o'];
  const cards = a => { for (const c of a) if (c && typeof c === 'object') for (const k of CARD) if (k in c) { c[k] = A(c[k]); cards(c[k]); } };
  const fix = (list, keys) => { for (const o of A(list)) for (const k of keys) if (k in o) { o[k] = A(o[k]); cards(o[k]); } };
  fix(DB.recipes, ['inp', 'outp', 'stns', 'meta']);
  fix(DB.items, ['stats', 'study', 'facts', 'qual', 'buffs', 'eff', 'cont', 'vari', 'sold', 'bought', 'other', 'runes', 'rel', 'fish', 'alchR', 'growR']);
  fix(DB.stations, ['cost', 'unl', 'upg', 'ext', 'work', 'calc']);
  fix(DB.buildings, ['cost', 'unl', 'eff', 'vari']);
  fix(DB.techs, ['pre', 'unl', 'leads']);
  fix(DB.perks, ['eff', 'pre', 'aff', 'src']);
  fix(DB.talents, ['costs', 'par']);
  fix(DB.traders, ['sells', 'likes', 'ord', 'tiers']);
  fix(DB.fish, ['spots', 'fill', 'dish', 'baits']);
  fix(DB.buildings, ['rel']);
  // у «общих» коллекций объектами бывают только списки карточек — любой объект заворачиваем
  const wrapAll = list => {
    for (const o of A(list)) for (const k of Object.keys(o)) {
      const v = o[k];
      if (v && typeof v === 'object' && !Array.isArray(v)) o[k] = [v];
      if (Array.isArray(o[k])) cards(o[k]);
    }
  };
  for (const c of ['town', 'battles', 'units', 'orders', 'consumables', 'study', 'inspirations',
                   'zombiePerks', 'bodyParts', 'locations', 'characters', 'quests', 'sermons', 'achievements']) {
    DB[c] = A(DB[c]); wrapAll(DB[c]);
  }
})();

/* статическая разметка переводится один раз снятым слепком */
const STATIC = [];
function snapshotStatic(root) {
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  let n; while ((n = w.nextNode())) if (/[А-Яа-яЁё]/.test(n.nodeValue)) STATIC.push({ n, o: n.nodeValue });
  root.querySelectorAll('[placeholder],[aria-label],[title]').forEach(el => {
    for (const a of ['placeholder', 'aria-label', 'title']) {
      const v = el.getAttribute(a);
      if (v && /[А-Яа-яЁё]/.test(v)) STATIC.push({ el, a, o: v });
    }
  });
}
function applyStatic() {
  for (const s of STATIC) { if (s.n) s.n.nodeValue = L(s.o); else s.el.setAttribute(s.a, L(s.o)); }
  document.title = L('Кодекс смотрителя');
  document.documentElement.lang = lang;
}

const TECH = new Map(DB.techs.map(t => [t.s, t]));
const TECH_BY_NAME = new Map(DB.techs.map(t => [t.n, t]));
const BUILDING = new Map(DB.buildings.map(b => [b.s, b]));
const PRODUCERS = new Map();   // slug -> [recipe]
const CONSUMERS = new Map();   // slug -> [recipe]
const MCOLOR = {};             // mastery -> red|green|blue|amber

function indexRecipe(r) {
  const outs = A(r.outp).length ? A(r.outp) : (r.os ? [{ k: r.os, q: 1, n: r.o }] : []);
  for (const o of outs) {
    if (!PRODUCERS.has(o.k)) PRODUCERS.set(o.k, []);
    if (!PRODUCERS.get(o.k).includes(r)) PRODUCERS.get(o.k).push(r);
  }
  for (const i of A(r.inp)) {
    if (!CONSUMERS.has(i.k)) CONSUMERS.set(i.k, []);
    if (!CONSUMERS.get(i.k).includes(r)) CONSUMERS.get(i.k).push(r);
  }
  for (const m of A(r.meta)) {
    if (m.l && /mastery/i.test(m.l) && m.ic) {
      const c = /talent_(\w+)/.exec(m.ic);
      if (c && r.m) MCOLOR[r.m] = c[1];
    }
  }
}
DB.recipes.forEach(indexRecipe);

/* Рецепты вскрытия, бальзамирования и улья лежат не в общем списке, а на страницах
   станков (поле `recipes`). Подмешиваем те, чей результат иначе никем не производится. */
const EXTRA = [];
for (const st of DB.stations) {
  A(st.srec).forEach((r, ix) => {
    const outs = A(r.o).filter(o => o.h).map(o => ({ k: o.h, q: Number(o.q) || 1, n: o.t, ic: o.ic }));
    if (!outs.length) return;
    /* пропускаем, только если предмет уже кто-то делает по-настоящему: рецепты
       вида «предмет → тот же предмет получше» источником не считаются */
    const prods = PRODUCERS.get(outs[0].k);
    if (prods && !prods.every(p => A(p.inp).some(i => i.k === outs[0].k))) return;
    const meta = A(r.meta);
    const grab = re => meta.find(m => re.test(m.l || ''));
    const mm = grab(/mastery/i), tk = grab(/^ticks$/i), eg = grab(/energy/i);
    EXTRA.push({
      s: 'stn:' + st.s + ':' + ix, n: r.t || outs[0].n, o: outs[0].n, os: outs[0].k,
      made: String(outs[0].q), outp: outs, ic: outs[0].ic,
      inp: A(r.i).filter(i => i.h || i.t).map(i => ({ k: i.h || i.t, q: Number(i.q) || 1, n: i.t, ic: i.ic })),
      stn: st.n, sp: st.s, stns: [st.n],
      m: mm ? (mm.l || '').replace(/\s*mastery/i, '').trim() : (st.m || ''),
      ml: mm ? parseInt(mm.v, 10) : null,
      tk: tk ? Number(tk.v) : null, en: eg ? eg.v : '',
      kind: 'Hand craft', li: true, meta, note: r.nt || '', fromStation: true,
      qUnknown: A(r.o).some(o => !o.q)   // у грядок и вскрытия выход в данных не числом
    });
  });
}
EXTRA.forEach(r => { DB.recipes.push(r); indexRecipe(r); });
DB.meta.counts.recipes = DB.recipes.length;

/* Ингредиенты без собственной страницы (Story, Newspaper, молитвы, «Bream or Carp»…) —
   у вики на них 404. Делаем заглушки, чтобы у них были имя и иконка. */
(function stubs() {
  const seen = new Set();
  for (const r of DB.recipes) for (const x of A(r.inp).concat(A(r.outp))) {
    if (!x.k || ITEM.has(x.k) || seen.has(x.k)) continue;
    seen.add(x.k);
    const it = { s: x.k, n: x.n || x.k, c: 'Без страницы', ic: x.ic, stub: true, li: false };
    ITEM.set(x.k, it); DB.items.push(it);
  }
})();
const MC = m => ({red:'red', green:'green', blue:'blue', orange:'amber', purple:'blue', yellow:'amber'}[MCOLOR[m]] || 'amber');

/* ══════════════ «откуда взять» — обратный индекс по всем источникам ══════════════ */
const BY_NAME = new Map();
for (const i of DB.items) if (!BY_NAME.has(i.n)) BY_NAME.set(i.n, i.s);
const slugOf = (h, t) => h && ITEM.has(h) ? h : (BY_NAME.get(t) || (h || ''));

const WHERE = new Map();
function addWhere(slug, e) { if (!slug || !ITEM.has(slug)) return; if (!WHERE.has(slug)) WHERE.set(slug, []); WHERE.get(slug).push(e); }

for (const l of DB.locations) {
  for (const r of A(l.resources)) addWhere(slugOf(r.h, r.t), { k: 'node', t: l.n, s: r.t, ic: l.ic, go: ['loc', l.s] });
  for (const c of A(l.containers)) addWhere(slugOf(c.h, c.t), { k: 'chest', t: l.n, s: (c.q ? c.q + ' шт · ' : '') + (c.s || 'сундук'), ic: l.ic, go: ['loc', l.s] });
  for (const f of A(l.fish)) addWhere(slugOf(f.h, f.t), { k: 'fish', t: l.n, s: f.s || 'рыбалка', ic: l.ic, go: ['loc', l.s] });
}
for (const t of DB.traders) {
  for (const c of A(t.sells)) addWhere(slugOf(c.h, c.t), { k: 'buy', t: t.n, s: c.s || '', ch: A(c.ch), ic: t.ic, go: ['trader', t.s] });
  for (const c of A(t.likes)) addWhere(slugOf(c.h, c.t), { k: 'like', t: t.n, s: 'даёт лайки', ch: A(c.ch), ic: t.ic, go: ['trader', t.s] });
  for (const c of A(t.ord)) addWhere(slugOf(c.h, c.t), { k: 'order', t: t.n, s: (c.q ? c.q + ' шт — ' : '') + 'заказ', ch: A(c.ch), ic: t.ic, go: ['trader', t.s] });
}
for (const q of DB.quests) {
  for (const c of A(q.rewards)) { const s = slugOf(c.h, c.t); if (s) addWhere(s, { k: 'quest', t: q.n, s: (c.q ? c.q + ' шт · ' : '') + 'награда за квест', ic: q.ic, go: ['quest', q.s] }); }
  for (const c of A(q.needs)) { const s = slugOf(c.h, c.t); if (s) addWhere(s, { k: 'need', t: q.n, s: (c.q ? c.q + ' шт · ' : '') + 'нужно для квеста', ic: q.ic, go: ['quest', q.s] }); }
}
for (const c of DB.characters) for (const x of A(c.items)) addWhere(slugOf(x.h, x.t), { k: 'char', t: c.n, s: x.s || 'у персонажа', ic: c.ic, go: ['char', c.s] });
for (const f of DB.fish) addWhere(f.s, { k: 'rod', t: 'Рыбалка', s: [f.bait, f.time, f.bct].filter(Boolean).join(' · '), ic: f.ic, go: ['fishrow', f.s] });
for (const a of DB.alchemy) addWhere(a.item || a.s, { k: 'alchemy', t: 'Алхимия: ' + a.runes, s: (a.lab || '') + (a.mixes ? ' · ' + a.mixes + ' комбинаций' : ''), ic: a.ic, go: ['alch', a.s] });

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const MISS = new Map();   // что осталось непереведённым — для следующего прохода

const coin = s => s.replace(/(\d+)\s*g\b/g, '$1з').replace(/(\d+)\s*s\b/g, '$1с').replace(/(\d+)\s*b\b/g, '$1б');
const TPL = [

  [/^(.+) or (.+)$/, m => { const a = P(m[1]), b = P(m[2]); return a && b ? a + ' или ' + b : null; }],
  [/^(.+) at its usual stock$/, m => (P(m[1]) || coin(m[1])) + ' при обычном запасе'],

  [/^Up to \+?([\d.]+) Likes? a week:? ?(.*)$/, m =>

  [/^Any ([\d,\s]*(?:or \d+)?) ingredients? whose runes add up to exactly (.+) make it \((\d+) combinations?\)\. Each brew also uses 1 Alchemy Flask\.$/, m =>

    'Тир ' + m[1] + ' · ' + m[2] + ' лайков (+' + m[3] + ' с «' + (P(m[4]) || m[4]) + '») · ящики дают ' + coin(m[5])],
  [/^(\d+) placed in the world, shown on the map$/, m => m[1] + ' шт. в мире, отмечены на карте'],
  [/^(\d+) red and (\d+) white skulls?$/, m => m[1] + ' красных и ' + m[2] + ' белых черепов'],
  [/^Reputation with (.+?) \((.+)\)$/, m => 'Репутация с «' + (P(m[1]) || m[1]) + '» (' +
    m[2].replace('if the Red Eye was kept', 'если Красный глаз оставлен') + ')'],
  [/^Tech: (.+)$/, m => 'Технология: ' + (P(m[1]) || m[1])],
  [/^Stock (\d+)$/, m => 'Запас ' + m[1]],
  [/^(\d+) in stock$/, m => m[1] + ' в запасе'],
  [/^(Small|Medium|Big) order \((\d+) keys?\): (.+)$/, m =>

  [/^Costs the zombie (\d+) (red|green|blue) tech points$/, m =>
    'Зомби платит ' + m[1] + ' ' + ({ red: 'красных', green: 'зелёных', blue: 'синих' })[m[2]] + ' очков технологий'],
  [/^the zombie (\d+) (red|green|blue) tech points$/, m =>
    'зомби ' + m[1] + ' ' + ({ red: 'красных', green: 'зелёных', blue: 'синих' })[m[2]] + ' очков технологий'],
  [/^(\d+) successful ticks?$/, m => m[1] + ' удачных тиков'],
  [/^\d+ (?:red|green|blue)(?:, \d+ (?:red|green|blue))*$/, m =>
    m[0].replace(/red/g, 'крас.').replace(/green/g, 'зел.').replace(/blue/g, 'син.')],
  [/^(\d+) red, (\d+) white$/, m => m[1] + ' красн., ' + m[2] + ' бел.'],
  [/^(\d+) white$/, m => m[1] + ' бел.'],
  [/^no skulls$/, () => 'без черепов'],
  [/^\+([\d.]+) for each of (\d+) sold \(from trader level (\d+)\)$/, m =>
    '+' + m[1] + ' за каждые ' + m[2] + ' проданных (с уровня торговца ' + m[3] + ')'],
  [/^for (\d+) sold \(from trader level (\d+)\)$/, m => 'за ' + m[1] + ' проданных (с уровня торговца ' + m[2] + ')'],
  [/^\+(\d+) each with (.+)$/, m => '+' + m[1] + ' за каждый: ' + (P(m[2]) || m[2])],
  [/^amount varies with the bed(?:; (.+))?$/, m => 'зависит от грядки' + (m[1] ? '; ' + (P(m[1]) || m[1]) : '')],
  [/^(.+?) \(amount varies with the bed(?:; (.+))?\)$/, m => {
    const n = P(m[1]); if (!n) return null;
    return n + ' (зависит от грядки' + (m[2] ? '; ' + (P(m[2]) || m[2]) : '') + ')';
  }],
  [/^(Farming|Building|Smithing|Anatomy|Book writing) mastery \+(\d+)$/, m =>
    ({ Farming: 'Земледелие', Building: 'Строительство', Smithing: 'Кузнечное дело', Anatomy: 'Анатомия', 'Book writing': 'Книжное дело' })[m[1]] + ' +' + m[2]],
  [/^Costs (.+)$/, m => 'Стоит: ' + (P(m[1]) || m[1])],
  [/^Unlocked by (.+)$/, m => 'Открывается: ' + (P(m[1]) || m[1])],
  [/^(.+ runes?): (.+)$/, m => { const r = runes(m[1]); return r ? r + ': ' + (P(m[2]) || m[2]) : null; }],
  [/^(.+ runes?), (.+)$/, m => { const r = runes(m[1]); return r ? r + ', ' + (P(m[2]) || m[2]) : null; }],
  [/^Alchemic Powder \((.+)\)$/, m => 'Алхимический порошок (' + runes(m[1]) + ')'],

  [/^(\d+) for (\d+) (silver|gold|bronze)$/, m =>
    m[1] + ' за ' + m[2] + ' ' + ({ silver: 'серебра', gold: 'золота', bronze: 'бронзы' })[m[3]]],

  [/^For (\d+) min(?: (\d+) s)?$/, m => m[1] + ' мин' + (m[2] ? ' ' + m[2] + ' с' : '')],

  [/^Shop upgraded to (.+?) (I{1,3})$/, m => 'Лавка улучшена до «' + (P(m[1]) || m[1]) + ' ' + m[2] + '»'],

  [/^-(\d+) insanity, (.+)$/, m => '−' + m[1] + ' безумия, ' + (P(m[2]) || m[2])],
  [/^(\d+) red and (\d+) white skulls?, (.+)$/, m =>
    m[1] + ' красных и ' + m[2] + ' белых черепов, ' + (runes(m[3]) || m[3])],
  [/^(\d+) \((\d+) with (.+?)\) [×x] (.+)$/, m =>
    m[1] + ' (' + m[2] + ' с ' + (P(m[3]) || m[3]) + ') × ' + (P(m[4]) || m[4])],
  [/^(.+) operation: fewer than (\d+) of its (\d+) ticks succeed$/, m =>
    'Операция «' + (P(m[1]) || m[1]) + '»: удачных тиков меньше ' + m[2] + ' из ' + m[3]],
  [/^(.+) · (Day and night|Best by day|Best by night) · ([\d.]+)% \((.+)\)$/, m => {
    const when = { 'Day and night': 'днём и ночью', 'Best by day': 'лучше днём', 'Best by night': 'лучше ночью' }[m[2]];
    const inner = m[4].split(', ').map(x => P(x) || x).join(', ');
    return (P(m[1]) || m[1]) + ' · ' + when + ' · ' + m[3] + '% (' + inner + ')';
  }],
  [/^(\d+) (.+)$/, m => { const n = P(m[2]); return n ? m[1] + ' ' + n : null; }]
];
/* «2 red and 1 green runes» → «2 красных и 1 зелёная руны» */
function runes(s) {
  if (!/(red|green|blue)/.test(s)) return null;
  return s.replace(/\brunes?\b/g, 'рун').replace(/\brune\b/g, 'руна')
    .replace(/\bred\b/g, 'красн.').replace(/\bgreen\b/g, 'зел.').replace(/\bblue\b/g, 'син.')
    .replace(/\band\b/g, 'и').replace(/\s+/g, ' ').trim();
}
const SEPS = [' · ', ' + ', ', ', ' and ', ' / ', '; '];

function P(k) {                       // перевод одного фрагмента
  if (!k) return null;
  k = k.trim();
  if (!k || !/[A-Za-z]{2}/.test(k)) return k;
  const direct = RU_DATA[k] || RU[k];
  if (direct) return direct;
  if (k.indexOf('\n\n') > 0) {                                    // «присказка\n\nэффект»
    const ps = k.split('\n\n').map(p => P(p));
    if (ps.every(Boolean)) return ps.join('\n\n');
  }
  const q = /^(.+?) \((bronze|silver|gold)\)$/i.exec(k);          // «Wine (Silver)»
  if (q) { const n = P(q[1]); if (n) return n + ' (' + QUAL[q[2].toLowerCase()] + ')'; }
  for (const [re, fn] of TPL) {                 // совпавший шаблон может не собраться — идём дальше
    const m = re.exec(k);
    if (m) { const r = fn(m); if (r) return r; }
  }
  const ci = k.indexOf(': ');                    // «Глина: 1 red» внутри списков смесей
  if (ci > 0) {
    const l = P(k.slice(0, ci)), r = P(k.slice(ci + 2));
    if (l && r && (l !== k.slice(0, ci) || r !== k.slice(ci + 2))) return l + ': ' + r;
  }
  for (const sep of SEPS) {
    if (k.indexOf(sep) < 0) continue;
    const parts = k.split(sep);
    if (parts.length < 2 || parts.length > 12) continue;
    const out = parts.map(p => P(p));
    if (out.every(Boolean)) return out.join(sep === ' and ' ? ' и ' : sep);
  }
  return null;
}

function trData(s) {
  if (!s) return null;
  const k = s.trim();
  if (!k || !/[A-Za-z]{2}/.test(k)) return null;

const norm = s => String(s).toLowerCase().replace(/ё/g, 'е').replace(/[’']/g, "'").trim();
const SEARCH = DB.items.map(i => ({
  s: i.s, it: i,
  hay: norm([i.n, ru(i.n), i.c, RU_CAT[i.c] || '', i.kw || '', i.src || ''].join(' '))

function search(q, limit) {
  q = norm(q);
  if (!q) return [];
  const terms = q.split(/\s+/);
  const res = [];
  for (const e of SEARCH) {
    if (!terms.every(t => e.hay.includes(t))) continue;
    const n1 = norm(e.it.n), n2 = norm(ru(e.it.n));
    let score = 3;
    if (n1.startsWith(q) || n2.startsWith(q)) score = 0;
    else if (n1.includes(q) || n2.includes(q)) score = 1;
    res.push({ e, score, len: e.it.n.length });
  }
  res.sort((a, b) => a.score - b.score || a.len - b.len || a.e.it.n.localeCompare(b.e.it.n));
  return res.slice(0, limit || 30).map(r => r.e.it);
}

/* ══════════════ движок расчёта ══════════════ */
const MAXD = 40;

function alchemyRecipe(slug, idx) {
  const it = ITEM.get(slug);
  if (!it || !it.alchR || !it.alchR.length) return null;
  const mix = it.alchR[Math.min(idx || 0, it.alchR.length - 1)];
  const inp = (mix.i || []).filter(x => x.h).map(x => ({ k: x.h, q: Number(x.q) || 1, n: x.t }));
  if (ITEM.has('alchemy-flasks')) inp.push({ k: 'alchemy-flasks', q: 1, n: 'Alchemy Flasks', fromNote: true });
  return {
    s: 'alch:' + slug + ':' + (idx || 0), syn: 'alch', n: mix.t || 'Алхимическая смесь',
    o: it.n, os: slug, outp: [{ k: slug, q: 1, n: it.n }], inp,
    stn: 'Alchemy Workbench', sp: 'alchemy-workbench', m: 'Anatomy',
    ml: null, tk: null, made: '1', un: (mix.req || ''), kind: 'Hand craft', note: mix.nt || ''
  };
}
function producersOf(slug) {
  const list = (PRODUCERS.get(slug) || []).slice();
  if (state.alch) {
    const it = ITEM.get(slug);
    if (it && it.alchR && it.alchR.length) {
      for (let i = 0; i < it.alchR.length; i++) { const r = alchemyRecipe(slug, i); if (r) list.push(r); }
    }
  }
  return list;
}
function chosen(slug, list) {
  const want = state.pick[slug];
  if (want) { const f = list.find(r => r.s === want); if (f) return f; }
  const upgrade = r => A(r.inp).some(i => i.k === slug) ? 1 : 0;   // «предмет → он же получше» — в конец
  return list.slice().sort((a, b) =>
    upgrade(a) - upgrade(b) ||
    (a.li === false) - (b.li === false) ||
    (a.ml || 0) - (b.ml || 0) ||
    A(a.inp).length - A(b.inp).length ||
    String(a.n).localeCompare(String(b.n))
  )[0];
}

function build(slug, qty, ctx, path, depth, key) {
  const it = ITEM.get(slug);
  const node = { slug, it, name: it ? it.n : slug, qty, need: qty, kids: [], type: 'raw', key };
  if (!it) node.pseudo = true;

  const have = ctx.inv.get(slug) || 0;
  if (have > 0 && qty > 0) { const u = Math.min(have, qty); ctx.inv.set(slug, have - u); node.fromInv = u; qty -= u; }
  const sp = ctx.sur.get(slug) || 0;
  if (sp > 0 && qty > 0) { const u = Math.min(sp, qty); ctx.sur.set(slug, sp - u); node.fromSur = u; qty -= u; }
  node.qty = qty;
  if (qty <= 0) { node.type = 'have'; return node; }

  if (slug === 'fuel' && !state.fuel) { ctx.addRaw(slug, qty, node); return node; }
  const list = state.raw.includes(slug) ? [] : producersOf(slug);
  if (!list.length || depth >= MAXD || path.has(slug)) {
    if (path.has(slug)) node.cycle = true;
    if (it && it.alchR && it.alchR.length) node.alch = true;
    if (it && it.growR && it.growR.length) node.grow = true;
    ctx.addRaw(slug, qty, node);
    return node;
  }
  const r = chosen(slug, list);
  const mi = madeInfo(r, slug);
  const per = (state.perks && mi.boost > mi.base) ? mi.boost : mi.base;
  const crafts = Math.ceil(qty / per);
  const made = crafts * per;
  if (made > qty) ctx.sur.set(slug, (ctx.sur.get(slug) || 0) + (made - qty));

  node.co = [];
  for (const o of A(r.outp)) {
    if (!o.k || o.k === slug) continue;
    const got = (Number(o.q) || 0) * crafts;
    if (!got) continue;
    ctx.sur.set(o.k, (ctx.sur.get(o.k) || 0) + got);
    ctx.co.set(o.k, (ctx.co.get(o.k) || 0) + got);
    node.co.push({ k: o.k, q: got, n: o.n });
  }

  const ik = r.s + '|' + slug;
  const ex = ctx.jobs.get(ik);
  if (ex) { ex.crafts += crafts; ex.made += made; }

  if (r.tk) ctx.ticks += crafts * Number(r.tk);
  if (r.en && !isNaN(r.en)) ctx.energy += crafts * Number(r.en);
  const g = parsePts(r.tp);
  ctx.gain.red += g.red * crafts; ctx.gain.green += g.green * crafts; ctx.gain.blue += g.blue * crafts;
  if (r.stn) {
    const st = ctx.stn.get(r.stn) || { n: r.stn, sp: r.sp, crafts: 0, ticks: 0, jobs: new Set() };
    st.crafts += crafts; st.ticks += crafts * (Number(r.tk) || 0); st.jobs.add(r.s);
    ctx.stn.set(r.stn, st);
  }
  if (r.m && r.ml != null) ctx.mast.set(r.m, Math.max(ctx.mast.get(r.m) || 0, Number(r.ml)));
  if (r.un) ctx.techNames.add(r.un);
  if (r.ext) ctx.exts.add(r.ext);

  /* станция без входов — это добыча (шахта зомби, лесопилка, каменоломня):
     цикл всё равно надо отработать, поэтому показываем её и в списке «добыть» */
  if (!A(r.inp).length) {
    node.gather = true;
    const g = ctx.gather.get(slug) || { slug, qty: 0, crafts: 0, stn: r.stn };
    g.qty += qty; g.crafts += crafts; ctx.gather.set(slug, g);
  }

  const np = new Set(path); np.add(slug);
  A(r.inp).forEach((inp, ix) => {
    node.kids.push(build(inp.k, (Number(inp.q) || 1) * crafts, ctx, np, depth + 1, key + '/' + ix + ':' + inp.k));
  });
  return node;
}

function plan() {
  const ctx = {
    inv: new Map(state.inv.map(x => [x.slug, x.qty])), sur: new Map(),
    raw: new Map(), jobs: new Map(), stn: new Map(), mast: new Map(), co: new Map(), gather: new Map(),
    techNames: new Set(), exts: new Set(), ticks: 0, energy: 0,
    gain: { red: 0, green: 0, blue: 0 }, roots: [],
    addRaw(slug, qty, node) {
      const e = this.raw.get(slug) || { slug, qty: 0, node };
      e.qty += qty; this.raw.set(slug, e);
    }
  };
  state.targets.forEach((t, i) => ctx.roots.push(build(t.slug, t.qty, ctx, new Set(), 0, 't' + i)));

  /* технологии + их предки */
  const techs = new Map();
  const add = t => {
    if (!t || techs.has(t.s)) return;
    techs.set(t.s, t);
    for (const p of (t.pre || [])) { const pt = TECH.get(p.h) || TECH_BY_NAME.get(p.t); if (pt) add(pt); }
  };
  for (const n of ctx.techNames) { const t = TECH_BY_NAME.get(n); if (t) add(t); else ctx.unknownTech = (ctx.unknownTech || []).concat(n); }
  if (state.stationCost) {
    for (const s of ctx.stn.values()) {
      const st = STATION.get(s.sp);
      for (const u of ((st && st.unl) || [])) { const t = TECH.get(u.h) || TECH_BY_NAME.get(u.t); if (t) add(t); }
    }
  }
  ctx.techs = [...techs.values()].sort((a, b) => (a.br || '').localeCompare(b.br || '') || (a.col || 0) - (b.col || 0));
  ctx.cost = ctx.techs.reduce((a, t) => ({ red: a.red + (t.red || 0), green: a.green + (t.grn || 0), blue: a.blue + (t.blu || 0) }), { red: 0, green: 0, blue: 0 });
  return ctx;
}

    if (n.alts && n.alts.length > 1) {
      parts.push(`<select class="pick" data-pick="${esc(n.slug)}" aria-label="выбрать рецепт">` +
        n.alts.map(a => `<option value="${esc(a.s)}"${a.s === r.s ? ' selected' : ''}>${esc(a.stn || a.n)}${a.made ? ' · ' + esc(a.made) : ''}</option>`).join('') + `</select>`);
    }
    parts.push(`<button class="chip act" data-forceraw="${esc(n.slug)}" title="не крафтить, считать сырьём">сырьё</button>`);
  } else if (n.type === 'raw') {
    const src = it && it.src ? it.src : '';
    if (n.cycle) parts.push(`<span class="chip warn">циклический рецепт</span>`);
    if (n.alch) parts.push(`<span class="chip m-blue">алхимия${it.alchT ? ' · ' + esc(it.alchT) + ' прим.' : ''}</span>`);
    if (n.grow) parts.push(`<span class="chip m-green">грядка</span>`);
    if (n.pseudo) parts.push(`<span class="chip warn">вариант на выбор</span>`);
    if (src) parts.push(`<span class="chip raw">${esc(src)}</span>`);
    if (it && it.p) parts.push(`<span class="chip">${money(it.p * n.qty)}</span>`);
    if (state.raw.includes(n.slug)) parts.push(`<button class="chip act" data-unraw="${esc(n.slug)}">крафтить</button>`);
  }
  parts.push(`</span></div>`);
  if (n.type === 'craft' && n.recipe && n.recipe.syn === 'alch' && n.recipe.note)
    parts.push(`<div class="note" style="padding-left:41px">${esc(n.recipe.note)}</div>`);
  if (n.type === 'raw' && n.grow && it.growR[0]) {
    const seeds = (it.growR[0].i || []).map(x => `${x.q || ''} ${x.t}`).join(', ');
    parts.push(`<div class="note" style="padding-left:41px">${esc(it.growR[0].t || 'грядка')}${seeds ? ': ' + esc(seeds) : ''}</div>`);
  }
  if (hasKids && !collapsed) for (const k of n.kids) parts.push(treeNode(k, depth + 1));
  parts.push(`</div>`);
  return parts.join('');
}

function renderPlan() {
  const ctx = plan();
  window.__ctx = ctx;

  document.getElementById('tree').innerHTML = ctx.roots.length
    ? ctx.roots.map(n => treeNode(n, 0)).join('')
    : `<div class="empty">Выберите цель слева.</div>`;
  const steps = [...ctx.jobs.values()].reduce((a, j) => a + j.crafts, 0);
  document.getElementById('plan-count').textContent = ctx.roots.length ? `${num(steps)} крафтов · ${num(ctx.jobs.size)} рецептов` : '';

  /* сырьё */
  const raws = [...ctx.raw.values()].sort((a, b) => {
    const ia = ITEM.get(a.slug), ib = ITEM.get(b.slug);
    return String((ia && ia.c) || 'я').localeCompare(String((ib && ib.c) || 'я')) || b.qty - a.qty;
  });
  let cost = 0;
  const gathers = [...ctx.gather.values()].sort((a, b) => b.qty - a.qty).map(g => {
    const it = ITEM.get(g.slug);
    return `<div class="mat">${iconOf(g.slug, 26)}
      <div class="nm"><button data-item="${esc(g.slug)}">${esc(it ? nm(it) : g.slug)}</button>
        <small>добыть · ${esc(g.stn || '')} · ${num(g.crafts)} цикл.</small></div>
      <span class="n">${num(g.qty)}</span><span class="cv"></span></div>`;
  }).join('');
  document.getElementById('raw').innerHTML = (gathers || '') + (raws.length ? raws.map(e => {
    const it = ITEM.get(e.slug);
    if (it && it.p) cost += it.p * e.qty;
    return `<div class="mat">${iconOf(e.slug, 26)}
      <div class="nm"><button data-item="${esc(e.slug)}">${esc(it ? nm(it) : e.slug)}</button>${it ? `<small>${esc(RU_CAT[it.c] || it.c || '')}${it.src ? ' · ' + esc(it.src) : ''}</small>` : '<small>вариант на выбор</small>'}</div>
      <span class="n">${num(e.qty)}</span><span class="cv">${it && it.p ? money(it.p * e.qty) : ''}</span></div>`;
  }).join('') : (gathers ? '' : `<div class="empty">—</div>`));
  document.getElementById('raw-count').textContent = (raws.length + ctx.gather.size) ? `${raws.length + ctx.gather.size} позиц.` : '';

  /* итоги */
  let sell = 0;
  for (const t of state.targets) { const it = ITEM.get(t.slug); if (it && it.p) sell += it.p * t.qty; }
  document.getElementById('totals').innerHTML = `
    <dl class="kv">
      <dt>Тиков работы</dt><dd>${num(ctx.ticks)}</dd>
      ${ctx.energy ? `<dt>Энергии</dt><dd>${num(ctx.energy)}</dd>` : ''}
      <dt>Сырьё по базовой цене</dt><dd>${money(cost)}</dd>
      <dt>Цель по базовой цене</dt><dd>${money(sell)}</dd>
      <dt>Разница</dt><dd style="color:${sell - cost >= 0 ? 'var(--ok)' : 'var(--bad)'}">${money(Math.abs(sell - cost))}${sell - cost < 0 ? ' в минус' : ''}</dd>
    </dl>
    ${ctx.co.size ? `<hr class="rule"><div class="eyebrow">Попутно получите</div>
      <div class="ing" style="margin-top:5px">${[...ctx.co.entries()].sort((a, b) => b[1] - a[1]).map(([k, q]) =>
        `<span>${iconOf(k, 18)}<b>${num(q)}</b> ${esc(nm(ITEM.get(k)) || k)}</span>`).join('')}</div>
      <div class="note" style="margin-top:4px">уже вычтено из потребности — план учитывает побочный выход</div>` : ''}
    <hr class="rule">
    <div class="eyebrow">Очков за крафт</div>
    <div class="pts" style="margin-top:5px">
      ${ctx.gain.red ? `<span class="pt red">+${num(ctx.gain.red)} красных</span>` : ''}
      ${ctx.gain.green ? `<span class="pt green">+${num(ctx.gain.green)} зелёных</span>` : ''}
      ${ctx.gain.blue ? `<span class="pt blue">+${num(ctx.gain.blue)} синих</span>` : ''}
      ${!ctx.gain.red && !ctx.gain.green && !ctx.gain.blue ? '<span class="note">нет</span>' : ''}
    </div>`;

  /* требования */
  const mast = [...ctx.mast.entries()].sort((a, b) => b[1] - a[1]);
  const reqs = [];
  reqs.push(`<div class="eyebrow">Мастерства (максимум по плану)</div><div class="pts" style="margin:5px 0 10px">${
    mast.length ? mast.map(([m, l]) => `<span class="chip m-${MC(m)}">${esc(RU_M[m] || m)} ${l}</span>`).join('') : '<span class="note">нет</span>'}</div>`);
  reqs.push(`<div class="eyebrow">Технологии, включая предпосылки</div>`);
  reqs.push(`<div class="pts" style="margin:5px 0 6px">
    ${ctx.cost.red ? `<span class="pt red">${num(ctx.cost.red)} красных</span>` : ''}
    ${ctx.cost.green ? `<span class="pt green">${num(ctx.cost.green)} зелёных</span>` : ''}
    ${ctx.cost.blue ? `<span class="pt blue">${num(ctx.cost.blue)} синих</span>` : ''}
    ${!ctx.techs.length ? '<span class="note">нет</span>' : ''}</div>`);
  if (ctx.techs.length) reqs.push(`<div class="list" style="margin-bottom:10px">${ctx.techs.map(t =>
    `<div class="li"><span class="q"></span><button data-tech="${esc(t.s)}">${esc(t.n)}</button><span class="chip">${esc(t.br || '')}</span><span class="chip m-${t.red ? 'red' : t.grn ? 'green' : 'blue'}">${esc(t.cl || '')}</span></div>`).join('')}</div>`);
  if (ctx.unknownTech) {
    const q = ctx.unknownTech.filter(n => QUEST_UNLOCK.has(n)), u = ctx.unknownTech.filter(n => !QUEST_UNLOCK.has(n));
    if (q.length) reqs.push(`<div class="warnbox">Открывается квестом, а не исследованием — за очки не купить: <b>${q.map(esc).join(', ')}</b></div>`);
    if (u.length) reqs.push(`<div class="warnbox">Нет в дереве технологий (квест или событие): ${u.map(esc).join(', ')}</div>`);
  }
  if (ctx.exts.size) reqs.push(`<div class="eyebrow">Пристройки к станкам</div><div class="pts" style="margin:5px 0 10px">${[...ctx.exts].map(e => `<span class="chip">${esc(e)}</span>`).join('')}</div>`);
  if (state.stationCost) {
    const rows = [...ctx.stn.values()].map(s => {
      const st = STATION.get(s.sp);
      if (!st) return `<div class="li"><b>${esc(s.n)}</b><span class="note">нет данных о постройке</span></div>`;
      const c = (st.cost || []).map(x => `<span class="li" style="display:inline-flex">${icon(x.ic, 18)}<span class="q">${esc(x.q || '')}</span> ${esc(ru(x.t) || x.t)}</span>`).join(' ');
      return `<div style="padding:4px 0;border-bottom:1px solid var(--line-soft)"><div class="li"><button data-stn="${esc(st.s)}"><b>${esc(st.n)}</b></button>${st.zone ? `<span class="chip">${esc(st.zone)}</span>` : ''}</div><div class="ing" style="margin-top:3px">${c || '<span class="note">бесплатно / не строится</span>'}</div></div>`;
    }).join('');
    reqs.push(`<div class="eyebrow">Постройка станков</div><div style="margin-top:5px">${rows}</div>`);
  }
  document.getElementById('reqs').innerHTML = reqs.join('');

  /* по станкам */
  const byStn = [...ctx.stn.values()].sort((a, b) => b.crafts - a.crafts);
  document.getElementById('bystation').innerHTML = byStn.length ? byStn.map(s => {
    const jobs = [...ctx.jobs.values()].filter(j => j.r.stn === s.n).sort((a, b) => b.crafts - a.crafts);
    return `<div style="padding:6px 0;border-bottom:1px solid var(--line-soft)">
      <div class="li" style="gap:8px">${icon((STATION.get(s.sp) || {}).ic, 24)}<button data-stn="${esc(s.sp)}"><b>${esc(s.n)}</b></button>
        <span class="chip">${num(s.crafts)} крафтов</span><span class="chip">${num(s.ticks)} тиков</span></div>
      <div class="ing" style="margin-top:4px;padding-left:32px">${jobs.map(j =>
        `<span>${iconOf(j.slug, 18)}<b>${num(j.made)}</b> ${esc(nm(ITEM.get(j.slug)) || j.slug)} <em class="note">×${j.crafts}</em></span>`).join('')}</div></div>`;
  }).join('') : `<div class="empty">—</div>`;

  save();
}

function itemRows() {
  const q = norm(itemFilter.q);

    if (itemFilter.cats.size && !itemFilter.cats.has(i.c)) return false;
    if (itemFilter.craftOnly && !PRODUCERS.has(i.s)) return false;
    if (!q) return true;
    return norm([i.n, ru(i.n), i.c, RU_CAT[i.c] || '', i.kw || ''].join(' ')).includes(q);
  }).sort((a, b) => (RU[a.n] || a.n).localeCompare(RU[b.n] || b.n, 'ru'));
  document.getElementById('if-count').textContent = `${list.length} из ${DB.items.length}`;

    <td><div class="cell"><button data-item="${esc(i.s)}" style="display:flex;gap:7px;align-items:center;text-align:left">${icon(i.ic, 26)}<span>${esc(nm(i))}${en(i) ? `<span class="en"> ${esc(en(i))}</span>` : ''}</span></button></div></td>

}

const SORT = {}, TABLES = {};
function drawTable(elId, cols, rows) {
  const st = SORT[elId] || (SORT[elId] = { k: null, d: 1 });
  const list = rows.slice();
  if (st.k != null && cols[st.k]) {
    const g = cols[st.k].get;
    list.sort((a, b) => { const x = g(a), y = g(b);
      return (typeof x === 'number' && typeof y === 'number' ? x - y : String(x).localeCompare(String(y))) * st.d; });
  }
  document.getElementById(elId).innerHTML = `<div class="scroll" style="max-height:74vh"><table><thead><tr>${cols.map((c, i) =>
    `<th class="${c.get ? 'sortable' : ''}${c.num ? ' num' : ''}"${c.get ? ` data-sort="${elId}:${i}"` : ''}>${TT(c.ru, c.en)}${st.k === i ? (st.d > 0 ? ' ▲' : ' ▼') : ''}</th>`).join('')}</tr></thead><tbody>${
    list.map(r => `<tr>${cols.map(c => `<td${c.num ? ' class="num"' : ''}>${c.html(r)}</td>`).join('')}</tr>`).join('')
    || `<tr><td colspan="${cols.length}" class="empty">${TT('Ничего не нашлось.', 'Nothing found.')}</td></tr>`}</tbody></table></div>`;
  TABLES[elId] = () => drawTable(elId, cols, rows);
}

function guideCell(c, first) {

function extrasBlock(slug) {
  const st = DB.study.find(s => pageSlug(s.page) === slug);
  const fo = DB.consumables.find(c => pageSlug(c.page) === slug);
  const ords = DB.orders.filter(o => pageSlug(o.itemPath) === slug);
  const bits = [];
  if (st) bits.push(`<div class="li"><span class="chip">Study Table</span><span>−${num(st.science)} ${TT('Науки', 'Science')} →</span>
    ${st.red ? `<span class="pt red">+${num(st.red)}</span>` : ''}${st.green ? `<span class="pt green">+${num(st.green)}</span>` : ''}${st.blue ? `<span class="pt blue">+${num(st.blue)}</span>` : ''}</div>`);
  if (fo) bits.push(`<div class="li"><span class="chip">${TT('Если съесть', 'When used')}</span>
    ${fo.energy ? `<span class="chip m-green">+${num(fo.energy)} ${TT('энергии', 'energy')}</span>` : ''}
    ${fo.insanity ? `<span class="chip m-blue">${num(fo.insanity)} ${TT('безумия', 'insanity')}</span>` : ''}
    ${fo.health ? `<span class="chip m-red">+${num(fo.health)} ${TT('здоровья', 'health')}</span>` : ''}</div>`);
  for (const o of ords) bits.push(`<div class="li">${icon(o.traderPortrait, 18)}<span class="chip m-amber">${TT('Заказ', 'Order')}</span>
    <button data-trader="${esc(pageSlug(o.traderPath))}">${esc(o.trader || '')}</button><span class="note">${esc(o.tier || '')} · ×${num(o.count)} · ${money(o.money)}${o.likes ? ' · ' + num(o.likes) + ' ' + TT('лайков', 'likes') : ''}</span></div>`);
  return bits.length ? `<div class="sect"><div class="eyebrow">${TT('Польза', 'Uses')}</div><div class="list">${bits.join('')}</div></div>` : '';

      <li>Цены — базовые; реальные у торговцев зависят от тира и репутации. Счётчики «168 перков» и «226 технологий» — это число записей в базе: источники дают от 93 до 222 перков и спорят о том, считать ли скрытые узлы.</li>

/* подбор смеси: сумма рун должна совпасть точно */
function solveMix(formula, have) {
  if (!have || !have.length) return [];
  const pool = DB.alchIng.filter(i => have.includes(i.s));
  const res = [], n = pool.length;
  const maxN = /II/.test(formula.lab || '') ? 3 : 2;
  const fit = arr => arr.reduce((a, x) => [a[0] + (x.red || 0), a[1] + (x.grn || 0), a[2] + (x.blu || 0)], [0, 0, 0]);
  for (let i = 0; i < n; i++) for (let j = i; j < n; j++) {
    const s = fit([pool[i], pool[j]]);
    if (s[0] === formula.red && s[1] === formula.grn && s[2] === formula.blu) res.push([pool[i], pool[j]]);
    if (maxN < 3) continue;
    for (let k = j; k < n; k++) {
      const s3 = fit([pool[i], pool[j], pool[k]]);
      if (s3[0] === formula.red && s3[1] === formula.grn && s3[2] === formula.blu) res.push([pool[i], pool[j], pool[k]]);
    }
  }
  return res;
}

/* ══════════════ события ══════════════ */
function bindFinder(inputId, resId, onPick) {
  const inp = document.getElementById(inputId), box = document.getElementById(resId);
  let list = [], cur = -1;
  const close = () => { box.hidden = true; cur = -1; };
  const draw = () => {
    list = search(inp.value, 24);
    if (!list.length) { close(); return; }
    box.innerHTML = list.map((i, x) => `<button data-pick-i="${x}" class="${x === cur ? 'on' : ''}">
      ${icon(i.ic, 26)}<span class="nm">${esc(nm(i))}${en(i) ? `<span class="en">${esc(en(i))}</span>` : ''}</span>
      <span class="cat">${esc(RU_CAT[i.c] || i.c || '')}</span></button>`).join('');
    box.hidden = false;
  };
  inp.oninput = draw;
  inp.onfocus = () => { if (inp.value) draw(); };
  inp.onblur = () => setTimeout(close, 160);
  inp.onkeydown = e => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); cur = Math.max(0, Math.min(list.length - 1, cur + (e.key === 'ArrowDown' ? 1 : -1))); draw(); }
    else if (e.key === 'Enter' && list.length) { onPick(list[Math.max(0, cur)].s); inp.value = ''; close(); }
    else if (e.key === 'Escape') close();
  };
  box.onmousedown = e => {
    const b = e.target.closest('[data-pick-i]'); if (!b) return;
    e.preventDefault(); onPick(list[+b.dataset.pickI].s); inp.value = ''; close();
  };
}
bindFinder('f-target', 'r-target', slug => {
  const t = state.targets.find(x => x.slug === slug);
  if (t) t.qty++; else state.targets.push({ slug, qty: 1 });
  renderTargets(); renderPlan();
});
bindFinder('f-inv', 'r-inv', slug => {
  const t = state.inv.find(x => x.slug === slug);
  if (t) t.qty += 10; else state.inv.push({ slug, qty: 10 });
  renderInv(); renderPlan();
});

document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab],[data-item],[data-stn],[data-tech],[data-close],[data-fold],[data-forceraw],[data-unraw],[data-tq],[data-tdel],[data-iq],[data-idel],[data-addtarget],[data-addinv],[data-stnrec],[data-loc],[data-trader],[data-quest],[data-char],[data-alch],[data-have],[data-group],[data-sort],[data-battle],[data-bld],[data-gpage]');
  if (!t) return;
  const d = t.dataset;
  if (d.tab) return go(d.tab);
  if (d.group) { const g = GROUPS.find(x => x[0] === d.group); if (g) go(g[3][0][0]); return; }
  if (d.sort) {
    const [id, i] = d.sort.split(':'); const st = SORT[id] || (SORT[id] = { k: null, d: 1 });
    if (st.k === +i) st.d = -st.d; else { st.k = +i; st.d = 1; }
    return TABLES[id] && TABLES[id]();
  }
  if (d.battle) return openBattle(d.battle);
  if (d.bld) return openBuilding(d.bld);
  if (d.gpage) { guidePage = d.gpage; return viewGuides(); }
  if (d.close !== undefined) return closeDrawer();
  if (d.item) return openItem(d.item);
  if (d.stn) return openStation(d.stn);
  if (d.tech) return openTech(d.tech);
  if (d.loc) return openLoc(d.loc);
  if (d.trader) return openTrader(d.trader);
  if (d.quest) return openQuest(d.quest);
  if (d.char) return openChar(d.char);
  if (d.alch) return openAlch(d.alch);
  if (d.have) {
    state.alchHave = state.alchHave || [];
    const i = state.alchHave.indexOf(d.have);
    if (i < 0) state.alchHave.push(d.have); else state.alchHave.splice(i, 1);
    save(); built.alchemy = true; return viewAlchemy();
  }
  if (d.stnrec) { closeDrawer(); recFilter.stn = d.stnrec; go('recipes'); built.recipes = true; viewRecipes(); document.getElementById('rf-stn').value = d.stnrec; recRows(); return; }
  if (d.fold) { state.open[d.fold] = state.open[d.fold] === false ? true : false; return renderPlan(); }
  if (d.forceraw) { if (!state.raw.includes(d.forceraw)) state.raw.push(d.forceraw); return renderPlan(); }
  if (d.unraw) { state.raw = state.raw.filter(x => x !== d.unraw); return renderPlan(); }
  if (d.tq !== undefined) { const i = +d.tq; state.targets[i].qty = Math.max(1, state.targets[i].qty + (+d.d)); renderTargets(); return renderPlan(); }
  if (d.tdel !== undefined) { state.targets.splice(+d.tdel, 1); renderTargets(); return renderPlan(); }
  if (d.iq !== undefined) { const i = +d.iq; state.inv[i].qty = Math.max(0, state.inv[i].qty + (+d.d) * 10); renderInv(); return renderPlan(); }
  if (d.idel !== undefined) { state.inv.splice(+d.idel, 1); renderInv(); return renderPlan(); }
  if (d.addtarget) { const x = state.targets.find(y => y.slug === d.addtarget); if (x) x.qty++; else state.targets.push({ slug: d.addtarget, qty: 1 }); closeDrawer(); go('calc'); renderTargets(); return renderPlan(); }
  if (d.addinv) { const x = state.inv.find(y => y.slug === d.addinv); if (x) x.qty += 10; else state.inv.push({ slug: d.addinv, qty: 10 }); closeDrawer(); go('calc'); renderInv(); return renderPlan(); }
});
document.addEventListener('change', e => {
  if (e.target.dataset.pick) { state.pick[e.target.dataset.pick] = e.target.value; renderPlan(); }
});
document.addEventListener('input', e => {
  const d = e.target.dataset;
  if (d.ti !== undefined) { state.targets[+d.ti].qty = Math.max(1, +e.target.value || 1); renderPlan(); }
  if (d.ii !== undefined) { state.inv[+d.ii].qty = Math.max(0, +e.target.value || 0); renderPlan(); }
});
for (const [id, key] of [['o-perks', 'perks'], ['o-station', 'stationCost'], ['o-alch', 'alch'], ['o-fuel', 'fuel']]) {
  const el = document.getElementById(id);
  el.checked = !!state[key];
  el.onchange = () => { state[key] = el.checked; renderPlan(); };
}
document.getElementById('btn-reset').onclick = () => {
  state = JSON.parse(JSON.stringify(DEFAULT_STATE));
  for (const [id, key] of [['o-perks', 'perks'], ['o-station', 'stationCost'], ['o-alch', 'alch'], ['o-fuel', 'fuel']]) document.getElementById(id).checked = !!state[key];
  renderTargets(); renderInv(); renderPlan();
};
document.getElementById('btn-copy').onclick = async () => {
  const ctx = window.__ctx || plan();
  const L = [];
  L.push('ЦЕЛЬ: ' + state.targets.map(t => `${t.qty} × ${nm(ITEM.get(t.slug)) || t.slug}`).join(', '));
  L.push('');
  L.push('СЫРЬЁ:');
  for (const r of [...ctx.raw.values()].sort((a, b) => b.qty - a.qty)) L.push(`  ${String(r.qty).padStart(6)} ${nm(ITEM.get(r.slug)) || r.slug}`);
  L.push('');
  L.push('КРАФТ ПО СТАНКАМ:');
  for (const s of [...ctx.stn.values()].sort((a, b) => b.crafts - a.crafts)) {
    L.push(`  ${s.n} — ${s.crafts} крафтов, ${s.ticks} тиков`);
    for (const j of [...ctx.jobs.values()].filter(j => j.r.stn === s.n)) L.push(`      ${j.made} × ${nm(ITEM.get(j.slug)) || j.slug} (×${j.crafts})`);
  }
  L.push('');
  L.push(`ИТОГО: ${ctx.ticks} тиков · мастерства: ${[...ctx.mast].map(([m, l]) => `${RU_M[m] || m} ${l}`).join(', ')}`);
  L.push(`ТЕХНОЛОГИИ (${ctx.techs.length}): ${ctx.cost.red} красн. / ${ctx.cost.green} зел. / ${ctx.cost.blue} син.`);
  for (const t of ctx.techs) L.push(`  ${t.n} — ${t.cl || ''}`);
  const txt = L.join('\n');
  const btn = document.getElementById('btn-copy');
  try { await navigator.clipboard.writeText(txt); btn.textContent = 'Скопировано'; }
  catch (err) { btn.textContent = 'Не вышло скопировать'; }
  setTimeout(() => { btn.textContent = 'Скопировать план текстом'; }, 1800);
};
